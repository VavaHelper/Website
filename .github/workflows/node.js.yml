name: Node.js Building CI

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v3

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: 🛠️ Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # opcional: se sua app está em um subdiretório, defina working-directory nas etapas abaixo
      # exemplo: working-directory: ./apps/web

      - name: 📚 Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
        # garante que devDependencies serão instaladas (se você tem NODE_ENV definido em outro lugar)
        env:
          NODE_ENV: development

      - name: 🧾 Debug mostrar versões e bins
        run: |
          node -v
          pnpm -v
          echo "Listando node_modules/.bin (se existir):"
          ls -la node_modules/.bin || true
          echo "package.json scripts:"
          cat package.json | jq '.scripts' || true

      - name: 🏗️ Run build
        run: pnpm build
        # se o seu app está em subpasta:
        # run: pnpm --filter ./path/to/app build
